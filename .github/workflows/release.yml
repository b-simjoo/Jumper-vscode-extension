name: Release

# Builds the .vsix when a release is published and attaches it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node test-positions.js

      - name: Check that package.json version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$pkg" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$pkg'"
            exit 1
          fi

      - name: Build .vsix
        run: npx --yes @vscode/vsce@4.1.1 package

      - name: Attach .vsix to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./*.vsix --clobber
